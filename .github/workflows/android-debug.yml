name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle 8.9 (no wrapper jar is committed) and caches dependencies.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::APK was not generated"; exit 1; }
          unzip -tq "$APK"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump badging "$APK" | tee badging.txt | head -5
          grep -q "package: name='com.roohu.roohux'" badging.txt || { echo "::error::Unexpected package name"; exit 1; }
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoohuX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Runs after the APK upload so a failing unit test never hides the APK, but still turns the run red.
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

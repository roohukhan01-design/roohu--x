name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper jar is committed: install Gradle 8.9 (required by AGP 8.7) and cache dependencies.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::APK was not generated"; exit 1; }
          unzip -tq "$APK"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump badging "$APK" | tee badging.txt | head -5
          grep -q "package: name='com.roohu.roohux'" badging.txt || { echo "::error::Unexpected package name"; exit 1; }
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoohuX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoohuX-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # The APK is always built and uploaded first; a failing test still turns the run red here.
      - name: Fail if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed (see the RoohuX-unit-test-report artifact)"
          exit 1
